<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A3. Neo Brutalist - Cover</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Instrument Sans', sans-serif;
      background: #F5F5F0;
      color: #0A0A0A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    
    .cover {
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16/9;
      background: white;
      border: 2px solid #0A0A0A;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 48px;
    }
    
    .corner-accent {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
    }
    
    .corner-accent.top { top: -80px; right: 120px; background: #CCFF00; }
    .corner-accent.bottom { bottom: -80px; left: 120px; background: #FF6B35; }
    
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0A0A0A;
      color: white;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 100px;
    }
    
    .badge .dot {
      width: 6px;
      height: 6px;
      background: #CCFF00;
      border-radius: 50%;
    }
    
    .date {
      font-size: 13px;
      color: #666;
      font-weight: 500;
    }
    
    .center-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 140px;
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: -5px;
    }
    
    h1 em {
      font-style: italic;
      color: #FF6B35;
    }
    
    .subtitle {
      font-size: 18px;
      color: #666;
      margin-top: 24px;
      max-width: 400px;
    }
    
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: relative;
      z-index: 1;
    }
    
    .presenter {
      font-size: 14px;
      font-weight: 500;
    }
    
    .presenter span {
      color: #999;
    }
    
    .page-num {
      font-size: 120px;
      font-weight: 700;
      color: #E5E5E0;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="corner-accent top"></div>
    <div class="corner-accent bottom"></div>
    
    <div class="top-bar">
      <div class="badge"><span class="dot"></span> Sprint 14</div>
      <div class="date">March 5, 2026</div>
    </div>
    
    <div class="center-content">
      <h1>Weekly<br/><em>Status</em></h1>
      <p class="subtitle">Progress update on Sprint 14. Key milestones, blockers, and next steps.</p>
    </div>
    
    <div class="bottom-bar">
      <div class="presenter">David Chen <span>— Principal Designer</span></div>
      <div class="page-num">01</div>
    </div>
  </div>
</body>
</html>
