<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A4. Kinetic Type - Cover</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    @keyframes slideIn {
      from { transform: translateX(-100px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #0D0D0D;
      color: #FAFAFA;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
    }
    
    .cover {
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16/9;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 64px;
      overflow: hidden;
    }
    
    .bg-text {
      position: absolute;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 500px;
      color: rgba(255,255,255,0.02);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      z-index: 0;
      pointer-events: none;
    }
    
    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255,51,102,0.15) 0%, transparent 70%);
      top: 20%;
      right: 10%;
      z-index: 0;
    }
    
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 4px;
    }
    
    .date {
      font-size: 12px;
      color: #666;
      letter-spacing: 1px;
    }
    
    .center-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    
    .overline {
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #FF3366;
      margin-bottom: 24px;
      font-weight: 500;
    }
    
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 180px;
      line-height: 0.85;
      letter-spacing: -4px;
    }
    
    h1 .line {
      display: block;
    }
    
    h1 .line:nth-child(2) {
      color: #FF3366;
      margin-left: 120px;
    }
    
    .subtitle {
      font-size: 16px;
      color: #666;
      margin-top: 32px;
      max-width: 400px;
      font-weight: 300;
      line-height: 1.6;
    }
    
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: relative;
      z-index: 1;
    }
    
    .presenter {
      font-size: 13px;
      font-weight: 400;
    }
    
    .presenter span {
      color: #666;
    }
    
    .sprint-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #666;
    }
    
    .sprint-badge::before {
      content: '';
      width: 24px;
      height: 2px;
      background: #FF3366;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="bg-text">STATUS</div>
    <div class="glow"></div>
    
    <div class="top-bar">
      <div class="logo">DESIGN TEAM</div>
      <div class="date">March 5, 2026</div>
    </div>
    
    <div class="center-content">
      <div class="overline">Weekly Update</div>
      <h1>
        <span class="line">STATUS</span>
        <span class="line">REPORT</span>
      </h1>
      <p class="subtitle">Sprint 14 progress, key milestones, and the path forward.</p>
    </div>
    
    <div class="bottom-bar">
      <div class="presenter">David Chen <span>— Principal Designer</span></div>
      <div class="sprint-badge">Sprint 14</div>
    </div>
  </div>
</body>
</html>
